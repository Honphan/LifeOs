version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lifeos-mysql
#    environment:
#      MYSQL_ROOT_PASSWORD: 2005
#      MYSQL_DATABASE: life_os
    ports:
      - "3306:3306"
#    healthcheck:
#      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
#      timeout: 20s
#      retries: 10

  mongodb:
    image: mongo:latest
    container_name: lifeos-mongo
    ports:
      - "27017:27017"

  redis:
    image: redis:alpine
    container_name: lifeos-redis
    ports:
      - "6379:6379"